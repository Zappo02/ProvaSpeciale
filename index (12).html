<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Prova Speciale – Gioco di Rally | Universo Sportivo</title>
<meta name="description" content="Prova Speciale: il gioco di rally di Universo Sportivo. Prova del giorno, carriera nei rally del mondo e campionati contro piloti IA su sterrato, neve e asfalto.">
<style>
:root{--bg:#0f1115;--panel:#1b1f29;--line:#2c3242;--ink:#f3f4f6;--mute:#9aa3b2;--acc:#ffb703;--red:#e63946;--green:#2ec27e}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#app{max-width:520px;margin:0 auto;padding:10px 10px 16px}
header{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
h1{font-size:20px;font-weight:900;letter-spacing:.3px;text-transform:uppercase}
h1 span{color:var(--acc)}
.tools{display:flex;gap:6px}
.tools button{background:#232733;border:0;color:#fff;border-radius:10px;height:34px;min-width:40px;padding:0 10px;font-weight:800;font-size:14px;cursor:pointer}
#wrap{position:relative;width:100%;border-radius:14px;overflow:hidden;background:#000;touch-action:none;user-select:none;-webkit-user-select:none}
canvas#cv{display:block;width:100%}
.ov{position:absolute;inset:0;display:flex;flex-direction:column;padding:16px;background:rgba(10,12,16,.84);overflow-y:auto;backdrop-filter:blur(2px)}
.box{margin:auto;display:flex;flex-direction:column;align-items:center;gap:10px;width:100%;max-width:400px;text-align:center}
.hidden{display:none!important}
.badge{display:inline-block;background:#232733;border-radius:999px;padding:6px 12px;font-size:13px;font-weight:700;color:var(--acc)}
.box h2{font-size:24px;font-weight:900;line-height:1.1;text-wrap:balance}
.box h3{font-size:13px;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:var(--mute);align-self:flex-start;margin-top:4px}
.box p{font-size:14px;line-height:1.45;color:#cfd5df}
.mute{color:var(--mute)!important}
.btn{width:100%;border:0;border-radius:12px;padding:13px 16px;font-size:16px;font-weight:800;cursor:pointer;background:#2a2f3c;color:#fff}
.btn.pri{background:var(--acc);color:#111}
.btn.sm{padding:9px 12px;font-size:13px}
.row{display:flex;gap:8px;width:100%}
.row .btn{flex:1}
.big{font-size:44px;font-weight:900;font-variant-numeric:tabular-nums;letter-spacing:.5px}
.rec{color:var(--acc);font-weight:900;font-size:15px;letter-spacing:1px;text-transform:uppercase}
table{border-collapse:collapse;font-size:13.5px;font-variant-numeric:tabular-nums;width:100%}
td{padding:5px 6px;text-align:left;border-bottom:1px solid #222734}
td.r{text-align:right}
tr.me td{color:var(--acc);font-weight:800}
.up{color:#ff6b6b}.dn{color:#4ade80}
.modes{display:grid;gap:9px;width:100%}
.mode{text-align:left;display:flex;gap:12px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px;color:#fff;cursor:pointer;font:inherit}
.mode:hover{border-color:#4b5468}
.mode i{font-style:normal;font-size:26px;width:34px;text-align:center}
.mode b{display:block;font-size:16px}
.mode span{display:block;font-size:12.5px;color:#aab3c2;margin-top:1px}
.mode em{display:block;font-style:normal;font-size:12px;color:var(--acc);margin-top:3px;font-weight:700}
.cars{display:grid;grid-template-columns:1fr 1fr;gap:8px;width:100%}
.carc{background:var(--panel);border:2px solid var(--line);border-radius:12px;padding:8px 9px;color:#fff;text-align:left;cursor:pointer;font:inherit}
.carc.sel{border-color:var(--acc)}
.carc.lock{opacity:.45;cursor:not-allowed}
.carc canvas{width:100%;height:40px;display:block}
.carc b{display:block;font-size:13px;margin:2px 0 1px}
.carc small{display:block;font-size:10.5px;color:var(--mute);line-height:1.25;min-height:26px}
.st{display:grid;grid-template-columns:auto 1fr;gap:2px 6px;align-items:center;margin-top:4px;font-size:10px;color:var(--mute)}
.bar{height:4px;background:#2c3242;border-radius:2px}
.bar i{display:block;height:100%;background:var(--acc);border-radius:2px}
.seg{display:flex;gap:6px;width:100%}
.seg button{flex:1;border:0;border-radius:10px;padding:11px 6px;font-weight:800;font-size:14px;background:#2a2f3c;color:#fff;cursor:pointer}
.seg button.sel{background:var(--acc);color:#111}
.list{width:100%;display:grid;gap:6px}
.list div{display:flex;justify-content:space-between;gap:8px;align-items:center;background:var(--panel);border-radius:10px;padding:9px 11px;font-size:13px;text-align:left}
.list div.cur{outline:2px solid var(--acc)}
.list div span:last-child{color:var(--mute);white-space:nowrap}
#controls{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px;user-select:none;-webkit-user-select:none}
.pad{display:flex;gap:8px}
.pad button{flex:1;height:76px;border-radius:14px;border:0;background:#232733;color:#fff;font-size:24px;font-weight:900;touch-action:none;cursor:pointer}
.pad button small{display:block;font-size:11px;font-weight:700;opacity:.8;margin-top:2px}
.pad button.on{background:#4b5468}
#gas.on{background:var(--green)}#brk.on{background:var(--red)}
.keys{font-size:12px;color:var(--mute)}
@media (hover:hover) and (pointer:fine){#controls{display:none}}
@media (hover:none),(pointer:coarse){.keys{display:none}}
.foot{margin-top:14px}
.all{display:block;padding:14px;border-radius:12px;background:#232733;color:#fff;text-decoration:none;font-weight:800;text-align:center;font-size:15px}
.all:hover{background:#2c3242}
</style>
</head>
<body>
<div id="app">
  <header>
    <h1 id="ttl">Prova <span>Speciale</span></h1>
    <div class="tools">

<script>
(()=>{

/* ================= lingua ================= */
const qs=new URLSearchParams(location.search);
let lang=qs.get('lang')==='en'?'en':'it';
const tr=(it,en)=>lang==='it'?it:en;

/* ================= dati ================= */
const NAMES=['Colle del Vento','Valle Scura','Passo dei Lupi','Monte Ferro','Bosco Nero','Rocca Alta','Piana dei Sassi','Gola del Diavolo','Pian del Faggio','Cresta Rossa','Fosso Lungo','Sella Grigia','Poggio Secco','Valico delle Aquile'];
const SURF={
 gravel:{grip:5.5,turn:2.55,acc:255,brake:430,maxV:400,offV:140,ground:'#5b7a36',ground2:'#4d6a2c',shoulder:'#7d5f3b',road:'#b38c5c',rut:'rgba(128,94,56,.55)',edge:'rgba(0,0,0,.12)',dust:'176,142,98',skid:'rgba(90,64,36,.30)',tree:['#2f5a2a','#3d6b31','#264d24'],icon:'🪨',it:'Sterrato',en:'Gravel'},
 snow:{grip:3.8,turn:2.35,acc:215,brake:360,maxV:370,offV:120,ground:'#eef2f6',ground2:'#dde5ee',shoulder:'#ffffff',road:'#cfd9e4',rut:'rgba(140,158,180,.5)',edge:'rgba(120,140,165,.25)',dust:'246,249,252',skid:'rgba(110,130,155,.35)',tree:['#24433a','#2d5244','#1d3a31'],icon:'❄️',it:'Neve',en:'Snow'},
 tarmac:{grip:11,turn:2.65,acc:285,brake:520,maxV:440,offV:150,ground:'#6a8b3c',ground2:'#5c7c33',shoulder:'#8b8676',road:'#45484e',rut:'rgba(25,25,28,.3)',edge:'#f2f2f2',dust:'70,70,74',skid:'rgba(10,10,12,.35)',tree:['#2f5a2a','#3d6b31','#264d24'],icon:'🛣️',it:'Asfalto',en:'Tarmac'}
};
const WEATHER={

};
const CARS=[
 {id:'volpe',name:'Volpe R2',num:'12',it:'Leggera e agile, poca potenza',en:'Light and nimble, low power',acc:.9,maxV:.9,grip:1.12,turn:1.12,brake:1.05,body:'#f97316',s1:'#ffffff',s2:'#111827',len:28,wid:17},
 {id:'aquila',name:'Aquila Rally2',num:'7',it:'Equilibrata, ideale per iniziare',en:'Balanced, ideal to start',acc:1,maxV:1,grip:1,turn:1,brake:1,body:'#f5f5f5',s1:'#e63946',s2:'#1d4ed8',len:30,wid:18},
 {id:'lupo',name:'Lupo WRC',num:'1',it:'Potente e veloce in rettilineo',en:'Powerful and fast on straights',acc:1.1,maxV:1.07,grip:1.03,turn:1,brake:1.08,body:'#1e3a8a',s1:'#facc15',s2:'#ffffff',len:31,wid:19},
 {id:'orso',name:'Orso 4x4',num:'4',it:'Pesante, grande tenuta su neve e terra',en:'Heavy, great grip on snow and dirt',acc:.95,maxV:.96,grip:1.06,turn:.93,brake:.95,allroad:true,body:'#166534',s1:'#e5e7eb',s2:'#f59e0b',len:32,wid:20},
 {id:'fulmine',name:'Fulmine Gr.B',num:'2',it:'Mostro anni \'80: potenza enorme, poca tenuta',en:'80s monster: huge power, little grip',acc:1.25,maxV:1.12,grip:.88,turn:1.06,brake:1,body:'#b91c1c',s1:'#111111',s2:'#fbbf24',len:31,wid:19,lock:'rally'},
 {id:'saetta',name:'Saetta Classic',num:'70',it:'Classica anni \'70, sterzo rapidissimo',en:'70s classic, razor-sharp steering',acc:1.05,maxV:1.02,grip:.95,turn:1.18,brake:1,body:'#facc15',s1:'#0f172a',s2:'#0f172a',len:28,wid:17,lock:'champ'}
];
const carById=id=>CARS.find(c=>c.id===id)||CARS[1];
const DRIVERS=[
 {n:'K. Lindqvist',col:'#0ea5e9',f:'🇸🇪',b:1.000,c:'lupo',sp:{snow:-.012}},
 {n:'T. Haapala',col:'#e5e7eb',f:'🇫🇮',b:1.008,c:'lupo',sp:{gravel:-.01}},
 {n:'J. Moreau',col:'#7c3aed',f:'🇫🇷',b:1.016,c:'aquila',sp:{tarmac:-.014}},
 {n:'M. Rossetti',col:'#dc2626',f:'🇮🇹',b:1.024,c:'lupo',sp:{}},
 {n:'S. Ogawa',col:'#f472b6',f:'🇯🇵',b:1.032,c:'aquila',sp:{tarmac:-.008}},
 {n:'R. Bellamy',col:'#0f766e',f:'🇬🇧',b:1.042,c:'orso',sp:{gravel:-.006}},
 {n:'P. Navarro',col:'#eab308',f:'🇪🇸',b:1.052,c:'aquila',sp:{tarmac:-.006}},
 {n:'H. Kipruto',col:'#16a34a',f:'🇰🇪',b:1.066,c:'orso',sp:{gravel:-.01}},
 {n:'A. Kowalski',col:'#94a3b8',f:'🇵🇱',b:1.08,c:'volpe',sp:{}}
];
const WORLD=[
 {flag:'🇮🇹',it:"Rally d'Italia",en:'Rally Italy',place:'Sardegna',style:{hp:.35,tight:.15},st:[['Monte Lerno','gravel','sun'],['Tula','gravel','sun'],['Coiluna','gravel','fog']]},
 {flag:'🇲🇨',it:'Rally di Montecarlo',en:'Monte-Carlo Rally',place:'Alpi Marittime',style:{hp:.7,tight:.3},st:[['Col de Turini','tarmac','night'],['La Bollène','snow','sun'],['Sisteron','tarmac','sun']]},
 {flag:'🇸🇪',it:'Rally di Svezia',en:'Rally Sweden',place:'Värmland',style:{hp:.25,tight:-.3},st:[['Vargåsen','snow','sun'],['Torsby','snow','snowfall'],['Hagfors','snow','night']]},
 {flag:'🇵🇹',it:'Rally del Portogallo',en:'Rally Portugal',place:'Fafe',style:{hp:.45,tight:.2},st:[['Fafe','gravel','fog'],['Arganil','gravel','sun'],['Lousã','gravel','rain']]},
 {flag:'🇰🇪',it:'Safari Rally Kenya',en:'Safari Rally Kenya',place:'Naivasha',style:{hp:.2,tight:-.2,straight:1.5},st:[['Hell\'s Gate','gravel','sun'],['Kedong','gravel','rain'],['Soysambu','gravel','sun']]},
 {flag:'🇫🇮',it:'Rally di Finlandia',en:'Rally Finland',place:'Jyväskylä',style:{hp:.12,tight:-.6,straight:1.2},st:[['Ouninpohja','gravel','sun'],['Päijälä','gravel','sun'],['Ruuhimäki','gravel','fog']]},
 {flag:'🇯🇵',it:'Rally del Giappone',en:'Rally Japan',place:'Aichi',style:{hp:.55,tight:.35},st:[['Isegami','tarmac','rain'],['Nukata','tarmac','sun'],['Shitara','tarmac','fog']]},
 {flag:'🇬🇧',it:'Rally del Galles',en:'Wales Rally',place:'Galles',style:{hp:.4,tight:.1},st:[['Sweet Lamb','gravel','rain'],['Brenig','gravel','fog'],['Dyfi','gravel','night']]}
];
const CHAMPS=[
 {id:'ita',flag:'🇮🇹',it:'Coppa Italia',en:'Italian Cup',diff:.87,style:{hp:.4,tight:.1},races:[['Langhe','gravel','sun'],['Madonie','tarmac','sun'],['Sila','gravel','fog']]},
 {id:'nord',flag:'❄️',it:'Trofeo Nordico',en:'Nordic Trophy',diff:.9,style:{hp:.3,tight:-.2},races:[['Rovaniemi','snow','sun'],['Kiruna','snow','night'],['Lillehammer','snow','snowfall']]},
 {id:'asf',flag:'🛣️',it:'Sfida Asfalto',en:'Tarmac Challenge',diff:.93,style:{hp:.5,tight:.3},races:[['Corsica','tarmac','sun'],['Eifel','tarmac','rain'],['Ypres','tarmac','night']]},
 {id:'world',flag:'🌍',it:'Gran Premio Mondiale',en:'World Grand Prix',diff:.96,style:{hp:.4,tight:0},races:[['Nairobi','gravel','rain'],['Sapporo','snow','night'],['Atacama','gravel','sun'],['Bathurst','tarmac','sun'],['Patagonia','gravel','fog']]}
];
const RALLY_PTS=[25,18,15,12,10,8,6,4,2,1];
const RACE_PTS=[10,8,6,5,4,3];
const DIFFS={easy:{it:'Facile',en:'Easy',m:1.11},norm:{it:'Normale',en:'Normal',m:1.04},hard:{it:'Difficile',en:'Hard',m:.985}};
const STEP=8,HW=44,RAD=[0,70,95,140,200,290,420],DT=1/60,CELL=128;

function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let x=Math.imul(a^a>>>15,1|a);x=x+Math.imul(x^x>>>7,61|x)^x;return((x^x>>>14)>>>0)/4294967296}}
const gk=(a,b)=>a+','+b;
const lsGet=k=>{try{const v=localStorage.getItem(k);return v?JSON.parse(v):null}catch(e){return null}};
const lsSet=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
const lsDel=k=>{try{localStorage.removeItem(k)}catch(e){}};
const fmt=n=>{const s=n/60;const m=Math.floor(s/60);const r=s-m*60;return m+':'+(r<10?'0':'')+r.toFixed(2)};
const fmtD=d=>(d>0?'+':'−')+Math.abs(d/60).toFixed(2);
const sName=s=>SURF[s][lang], wName=w=>WEATHER[w][lang];
const scen=(s,w)=>`${SURF[s].icon} ${sName(s)} · ${WEATHER[w].icon} ${wName(w)}`;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ================= generazione prova ================= */
function genStage(seed,o){
 o=o||{};
 const R=mulberry(seed);
 const sr=R(),wr=R(),nr=R();
 const surface=o.surface||['gravel','snow','tarmac'][Math.floor(sr*3)];
 let weather=o.weather;
 if(!weather)weather=wr<.6?'sun':wr<.75?(surface==='snow'?'snowfall':'rain'):wr<.87?'fog':'night';
 const name=o.name||NAMES[Math.floor(nr*NAMES.length)];
 const sty=Object.assign({hp:.45,tight:0,straight:1},o.style||{});
 const LEN=o.len||17000;
 const P=[];let x=0,y=0,h=0;P.push({x,y,h});
 const adv=(len,k)=>{const n=Math.max(1,Math.round(len/STEP));for(let i=0;i<n;i++){h+=k*STEP;x+=Math.sin(h)*STEP;y-=Math.cos(h)*STEP;P.push({x,y,h})}};
 const notes=[];
 adv(o.startLen||330,0);
 const LIM=1.75;
 while(P.length*STEP<LEN){
  let L=R()<.25?40+R()*45:90+R()*320;if(R()<.12)L=380+R()*300;
  adv(L*sty.straight,0);
  let s,ang,dir;const ah=Math.abs(h);
  if(ah>1.05&&R()<sty.hp){s=1;dir=-Math.sign(h);ang=Math.min(3,ah+.9+R()*.6)}
  else{
   let r=R();r=Math.max(0,Math.min(.999,r-sty.tight*.25));
   s=r<.12?2:r<.35?3:r<.62?4:r<.84?5:6;
   ang=s>=5?.35+R()*.6:s>=3?.6+R()*.85:.9+R()*.9;
   const pL=Math.min(.9,Math.max(.1,.5+h*.5));
   dir=R()<pL?-1:1;
   if(Math.abs(h+dir*ang)>LIM)dir=-dir;
   const tg=Math.max(-LIM,Math.min(LIM,h+dir*ang));ang=Math.max(.3,Math.abs(tg-h));
  }
  const rad=RAD[s];
  const n={i:P.length-1,s,dir,ang,long:ang>1.35&&s>1,end:0,link:false};
  adv(rad*ang,dir/rad);n.end=P.length-1;notes.push(n);
 }
 adv(460,0);
 for(let k=1;k<notes.length;k++)if(notes[k].i-notes[k-1].end<10)notes[k].link=true;
 const finish=P.length-32;
 const off=o2=>P.map(p=>({x:p.x+Math.cos(p.h)*o2,y:p.y+Math.sin(p.h)*o2}));
 const K=P.map((p,i)=>i<P.length-1?Math.abs(P[i+1].h-p.h)/STEP:0);
 const st={seed,surface,weather,name,P,K,notes,finish,startI:o.startI||12,EL:off(-(HW-5)),ER:off(HW-5),RL:off(-HW*.36),RR:off(HW*.36)};
 st.splits=[.25,.5,.75].map(f=>Math.round(10+(finish-10)*f));
 const tg=new Map();
 P.forEach((p,i)=>{const k=gk(Math.floor(p.x/64),Math.floor(p.y/64));let a=tg.get(k);if(!a)tg.set(k,a=[]);a.push(i)});
 const minTD=(x2,y2)=>{let m=1e9;const cx=Math.floor(x2/64),cy=Math.floor(y2/64);for(let i=-3;i<=3;i++)for(let j=-3;j<=3;j++){const a=tg.get(gk(cx+i,cy+j));if(a)for(const n of a){const d=Math.hypot(P[n].x-x2,P[n].y-y2);if(d<m)m=d}}return m};
 st.CH=[];
 for(let a=0;a<P.length-1;a+=32){const b=Math.min(P.length-1,a+33);let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;for(let i=a;i<=b;i++){const p=P[i];if(p.x<x0)x0=p.x;if(p.x>x1)x1=p.x;if(p.y<y0)y0=p.y;if(p.y>y1)y1=p.y}st.CH.push({a,b,x0:x0-HW-40,y0:y0-HW-40,x1:x1+HW+40,y1:y1+HW+40})}
 const D=[];
 for(let i=0;i<P.length;i+=2){
  for(const side of[-1,1]){
   if(R()>.34)continue;
   const p=P[i];const od=HW+16+Math.pow(R(),1.6)*200;
   const ox=p.x+Math.cos(p.h)*side*od+(R()-.5)*20,oy=p.y+Math.sin(p.h)*side*od+(R()-.5)*20;
   const q=R();let type;
   if(surface==='tarmac')type=q<.55?'tree':q<.68?'rock':'bush';else type=q<.62?'tree':q<.78?'rock':'bush';
   const r=type==='tree'?9+R()*8:6+R()*5;
   if(minTD(ox,oy)<HW+r+6)continue;
   D.push({x:ox,y:oy,r,type,c:R()});
  }
 }
 for(const n of notes){
  if(n.s>2)continue;
  const m=(n.i+n.end)>>1,side=n.s===1?-n.dir:n.dir;
  for(let i=n.i;i<=n.end;i+=3){const p=P[i];const bx=p.x+Math.cos(p.h)*(-n.dir)*(HW+13),by=p.y+Math.sin(p.h)*(-n.dir)*(HW+13);if(minTD(bx,by)>HW+6)D.push({x:bx,y:by,r:8,type:'bale',c:R()})}

function nearest(x,y,i0){const P=ST.P;let bi=i0,bd=1e12;const a=Math.max(0,i0-20),b=Math.min(P.length-1,i0+12);
 for(let i=a;i<=b;i++){const dx=P[i].x-x,dy=P[i].y-y,d=dx*dx+dy*dy;if(d<bd){bd=d;bi=i}}return{i:bi,d:Math.sqrt(bd)}}
function latOf(v){const p=ST.P[v.idx];return(v.x-p.x)*Math.cos(p.h)+(v.y-p.y)*Math.sin(p.h)}
function respawn(v){const i=Math.min(ST.P.length-1,v.idx),q=ST.P[i];const l=v.ai?v.ai.lane:0;v.x=q.x+Math.cos(q.h)*l;v.y=q.y+Math.sin(q.h)*l;v.a=q.h;v.vx=v.vy=0;v.steer=0;v.lastW=null;v.stuck=0}
function phys(v,inp,live){
 const P=ST.P,sp_=v.spec;
 if(v.rec>0){v.rec-=DT;v.vx*=.9;v.vy*=.9;v.x+=v.vx*DT;v.y+=v.vy*DT;if(v.rec<=0)respawn(v);return}
 const target=inp.s!=null?inp.s:(inp.r?1:0)-(inp.l?1:0);
 v.steer+=(target-v.steer)*Math.min(1,DT*9);
 const fx=Math.sin(v.a),fy=-Math.cos(v.a),rx=Math.cos(v.a),ry=Math.sin(v.a);
 let vf=v.vx*fx+v.vy*fy,vl=v.vx*rx+v.vy*ry;
 const q=nearest(v.x,v.y,v.idx);v.idx=q.i;v.off=q.d>HW;
 if(live&&q.d>HW+70){v.rec=.9;if(v.isPlayer)msg={txt:tr('Fuori strada!','Off the road!'),t:1.1,col:'#ffb703'};return}
 let grip=sp_.grip,maxV=sp_.maxV,drag=.25;
 if(v.off){grip*=.55;maxV=sp_.offV;drag=1.4}
 if(inp.g&&vf<maxV)vf+=sp_.acc*(1-Math.max(0,vf)/maxV)*DT;
 if(inp.b){if(vf>15)vf-=sp_.brake*DT;else if(!inp.g)vf=Math.max(-90,vf-150*DT)}
 if(vf>maxV)vf-=(vf-maxV)*2.5*DT;
 vf-=vf*drag*DT;
 if(!inp.g&&!inp.b)vf-=Math.sign(vf)*Math.min(Math.abs(vf),25*DT);
 let g=grip;if(!inp.ai&&inp.b&&Math.abs(v.steer)>.3&&vf>110)g*=.4;
 vl*=Math.exp(-g*DT);
 const sp=Math.abs(vf);
 const yaw=v.steer*sp_.turn*Math.min(1,sp/110)*(1-.3*Math.min(1,sp/sp_.maxV))*(vf<0?-1:1);
 v.a+=yaw*DT;
 v.vx=vf*fx+vl*rx;v.vy=vf*fy+vl*ry;v.vf=vf;v.vl=vl;
 v.x+=v.vx*DT;v.y+=v.vy*DT;
 const cx=Math.floor(v.x/CELL),cy=Math.floor(v.y/CELL);
 for(let i=-1;i<=1;i++)for(let j=-1;j<=1;j++){const a=ST.dg.get(gk(cx+i,cy+j));if(!a)continue;
  for(const o of a){if(o.type==='bush'||o.type==='fan')continue;const dx=v.x-o.x,dy=v.y-o.y,rr=o.r+10,d2=dx*dx+dy*dy;
   if(d2<rr*rr&&d2>.01){const d=Math.sqrt(d2),nx=dx/d,ny=dy/d;v.x=o.x+nx*rr;v.y=o.y+ny*rr;const vn=v.vx*nx+v.vy*ny;
    if(vn<0){const soft=o.type==='bale';const k=soft?.2:.35;v.vx-=(1+k)*vn*nx;v.vy-=(1+k)*vn*ny;const loss=soft?.85:.55;v.vx*=loss;v.vy*=loss;
     if(v.isPlayer&&-vn>80){shake=Math.min(12,-vn/22);if(mode==='run')hits++}}}}}
 if(v.quiet)return;
 const slide=Math.abs(vl)>45&&sp>50;
 const emit=slide||(v.off&&sp>50)||(ST.surface!=='tarmac'&&sp>230&&Math.random()<.25);
 const hl=v.def.len/2-4,hw=v.def.wid/2-1;
 const wl={x:v.x-fx*hl-rx*hw,y:v.y-fy*hl-ry*hw},wr={x:v.x-fx*hl+rx*hw,y:v.y-fy*hl+ry*hw};
 if(emit&&(ST.surface!=='tarmac'||slide||v.off)&&parts.length<520){
  for(const w of[wl,wr])if(Math.random()<.6)parts.push({x:w.x,y:w.y,vx:-v.vx*.15+(Math.random()-.5)*40,vy:-v.vy*.15+(Math.random()-.5)*40,life:0,max:.6+Math.random()*.6,r:4+Math.random()*4,col:v.off&&ST.surface==='tarmac'?'150,120,80':S.dust});
 }
 if(slide||(inp.b&&sp>160)){if(v.lastW){skids.push([v.lastW[0].x,v.lastW[0].y,wl.x,wl.y],[v.lastW[1].x,v.lastW[1].y,wr.x,wr.y]);if(skids.length>1600)skids.splice(0,200)}v.lastW=[wl,wr]}else v.lastW=null;
}
function collideCars(){

  const dx=b.x-a.x,dy=b.y-a.y,d2=dx*dx+dy*dy,R=21;
  if(d2<R*R&&d2>.01){const d=Math.sqrt(d2),nx=dx/d,ny=dy/d,o=(R-d)/2;a.x-=nx*o;a.y-=ny*o;b.x+=nx*o;b.y+=ny*o;
   const rv=(b.vx-a.vx)*nx+(b.vy-a.vy)*ny;
   if(rv<0){const jj=-1.3*rv/2;a.vx-=jj*nx;a.vy-=jj*ny;b.vx+=jj*nx;b.vy+=jj*ny;if((a.isPlayer||b.isPlayer)&&-rv>90){shake=Math.min(8,-rv/30);if(mode==='run')hits++}}}}

function vCorner(R,v,m){const T=v.spec.turn,mx=v.spec.maxV,gm=Math.min(.9,Math.max(.55,.45+.035*v.spec.grip));const x=R*T*m*gm;return x/(1+.3*x/mx)}
function aiInput(v){
 const P=ST.P,ai=v.ai,sp=Math.hypot(v.vx,v.vy);
 ai.laneT+=(ai.lane0-ai.laneT)*Math.min(1,DT*.6);
 if(veh.length>1){const vl=latOf(v);for(const o of veh){if(o===v||o.rec>0)continue;const di=o.idx-v.idx;
  if(di>0&&di<9){const ol=latOf(o);if(Math.abs(ol-vl)<24&&Math.hypot(o.vx,o.vy)<sp+25)ai.laneT=ol>0?Math.max(-28,ol-32):Math.min(28,ol+32)}}}
 ai.lane+=Math.sign(ai.laneT-ai.lane)*Math.min(Math.abs(ai.laneT-ai.lane),DT*45);
 const look=Math.min(P.length-1,v.idx+4+Math.floor(sp/45));
 const tp=P[look],tx=tp.x+Math.cos(tp.h)*ai.lane,ty=tp.y+Math.sin(tp.h)*ai.lane;
 let d=Math.atan2(tx-v.x,-(ty-v.y))-v.a;while(d>Math.PI)d-=Math.PI*2;while(d<-Math.PI)d+=Math.PI*2;

 for(let j=v.idx;j<end;j++){const k=ST.K[j];if(k<1e-5)continue;const vc=vCorner(1/k,v,m);const dist=Math.max(0,(j-v.idx)*STEP-10);
  const a=Math.sqrt(vc*vc+2*v.spec.brake*.75*dist);if(a<allow)allow=a}

}

   if(mode==='run'&&!v.fin&&v.idx>=ST.finish){v.fin=true;v.finN=stepN}
   if(!v.fin&&v.rec<=0){if(Math.hypot(v.vx,v.vy)<15)v.stuck+=DT;else v.stuck=0;if(v.stuck>1.6){v.idx=Math.min(ST.finish,v.idx+3);respawn(v)}}

    rank=veh.slice().sort((a,b)=>prog(b)-prog(a)).indexOf(me)+1;

 const draw=()=>show(`<div class="badge">🌍 ${tr('Carriera','Career')}</div><h2>${tr('Giro del mondo','World tour')}</h2>
  <p>${tr('8 rally in giro per il mondo, 3 prove speciali ciascuno, con fondo e meteo diversi. Sfidi 9 piloti a cronometro: ogni rally assegna punti per il campionato.','8 rallies around the world, 3 special stages each, with different surfaces and weather. You race 9 drivers against the clock: each rally awards championship points.')}</p>
  <div class="list">${WORLD.map((r,i)=>`<div><span>${i+1}. ${r.flag} ${r[lang]}</span><span>${[...new Set(r.st.map(s=>SURF[s[1]].icon+WEATHER[s[2]].icon))].join(' ')}</span></div>`).join('')}</div>
  <h3>${tr('Difficoltà','Difficulty')}</h3><div class="seg">${Object.keys(DIFFS).map(k=>`<button class="${k===diff?'sel':''}" data-act="d" data-arg="${k}">${DIFFS[k][lang]}</button>`).join('')}</div>
  <button class="btn pri" data-act="go">${tr('Scegli auto e parti','Choose car and start')}</button><button class="btn sm" data-act="back">${tr('Indietro','Back')}</button>`,
  {d:k=>{diff=k;draw()},back:home,go:()=>pickCar(c=>{
   const cs={diff,car:c,r:0,s:0,seed:Math.floor(Math.random()*1e9),cur:{stages:[],overall:{}},pts:{},log:[],done:false};
   lsSet(CK,cs);careerHub()},tr('Carriera','Career'),careerSetup)});
 draw();
}
function standings(pts){
 const names=[PLAYER,...DRIVERS.map(d=>d.n)];
 return names.map(n=>({n,p:pts[n]||0})).sort((a,b)=>b.p-a.p||(a.n===PLAYER?-1:1));
}
function standTable(list,lim){
 let rows='',shown=0;list.forEach((e,i)=>{if(i<lim||e.n===PLAYER){rows+=`<tr class="${e.n===PLAYER?'me':''}"><td>${i+1}.</td><td>${e.n===PLAYER?'🚗':flagOf(e.n)} ${esc(dispName(e.n))}</td><td class="r">${e.p}</td></tr>`;shown++}});
 return `<table>${rows}</table>`;
}
function stageDef(cs){const r=WORLD[cs.r],s=r.st[cs.s];return{name:s[0],surface:s[1],weather:s[2],style:r.style,len:12000,seed:cs.seed+cs.r*31+cs.s*7+1}}
function careerHub(){
 const cs=lsGet(CK);if(!cs){careerSetup();return}
 const r=WORLD[cs.r];const sd=stageDef(cs);
 previewStage(genStage(sd.seed,sd));mode='menu';
 const list=r.st.map((s,i)=>{const done=cs.cur.stages[i];let right=scen(s[1],s[2]);
  if(done){const arr=Object.entries(done).sort((a,b)=>a[1]-b[1]);right=`P${arr.findIndex(e=>e[0]===PLAYER)+1} · ${fmt(done[PLAYER])}`}
  return `<div class="${i===cs.s?'cur':''}"><span>${tr('PS','SS')}${i+1} ${esc(s[0])}</span><span>${right}</span></div>`}).join('');
 let ov2='';if(cs.s>0){const arr=Object.entries(cs.cur.overall).sort((a,b)=>a[1]-b[1]);const pos=arr.findIndex(e=>e[0]===PLAYER)+1;ov2=`<p class="mute">${tr('Classifica del rally','Rally standings')}: <b style="color:#fff">P${pos}</b> · ${pos===1?tr('al comando','leading'):fmtD(cs.cur.overall[PLAYER]-arr[0][1])+' '+tr('dal leader','to leader')}</p>`}
 show(`<div class="badge">${tr('Rally','Rally')} ${cs.r+1}/${WORLD.length} · ${DIFFS[cs.diff][lang]}</div><h2>${r.flag} ${r[lang]}</h2><p class="mute">${r.place} · ${carById(cs.car).name}</p>
  <div class="list">${list}</div>${ov2}
  <button class="btn pri" data-act="go">${tr('Corri','Drive')} ${tr('PS','SS')}${cs.s+1}: ${esc(sd.name)}</button>
  ${cs.s===0?`<button class="btn sm" data-act="car">${tr('Cambia auto','Change car')}</button>`:''}
  <h3>${tr('Campionato piloti','Drivers\' championship')}</h3>${standTable(standings(cs.pts),5)}
  <div class="row"><button class="btn sm" data-act="menu">Menu</button><button class="btn sm" data-act="reset">${tr('Nuova carriera','New career')}</button></div>`,
 {go:()=>{carSel=cs.car;startCareerStage()},menu:home,reset:()=>confirmBox(tr('Vuoi cancellare la carriera in corso?','Delete the current career?'),()=>{lsDel(CK);careerSetup()},careerHub),
  car:()=>pickCar(c=>{cs.car=c;lsSet(CK,cs);careerHub()},tr('Carriera','Career'),careerHub)});
}
function confirmBox(q,yes,no){show(`<h2>${q}</h2><div class="row"><button class="btn" data-act="no">${tr('No','No')}</button><button class="btn pri" data-act="yes">${tr('Sì','Yes')}</button></div>`,{yes,no})}
function startCareerStage(){
 const cs=lsGet(CK);const sd=stageDef(cs);
 setStage(genStage(sd.seed,sd));
 const base=simulate(carById('aquila'),1);
 const R=mulberry(sd.seed^0x5bd1);const dm=DIFFS[cs.diff].m;const prog_=cs.r/(WORLD.length-1);
 const stageAI=DRIVERS.map(d=>{
  let f=(d.b+(d.sp[sd.surface]||0))*dm*(1.05-.05*prog_)*(1+(R()-.5)*.018);
  let t=base.t*f;if(R()<.08)t+=240+R()*600;
  return{n:d.n,t:Math.round(t),sp:base.sp.map(x=>Math.round(x*f))};
 });
 game={type:'career',stageAI};carSel=cs.car;best=null;begin();
}
function careerStageDone(){
 const cs=lsGet(CK);const times={};times[PLAYER]=finishN;for(const a of game.stageAI)times[a.n]=a.t;
 cs.cur.stages[cs.s]=times;for(const n in times)cs.cur.overall[n]=(cs.cur.overall[n]||0)+times[n];
 game.stageIdx=cs.s;cs.s++;
 if(cs.s>=3){
  const arr=Object.entries(cs.cur.overall).sort((a,b)=>a[1]-b[1]);
  arr.forEach((e,i)=>{if(i<RALLY_PTS.length)cs.pts[e[0]]=(cs.pts[e[0]]||0)+RALLY_PTS[i]});
  const pos=arr.findIndex(e=>e[0]===PLAYER)+1;cs.log.push(pos);
  game.rallyEnd={arr,pos,r:cs.r};
  if(pos===1&&unlock('fulmine'))game.unlockF=true;
  cs.r++;cs.s=0;cs.cur={stages:[],overall:{}};if(cs.r>=WORLD.length)cs.done=true;
 }
 lsSet(CK,cs);game.cs=cs;
}
function resTable(arr,ref,lim){
 let rows='';arr.forEach((e,i)=>{if(i<lim||e[0]===PLAYER)rows+=`<tr class="${e[0]===PLAYER?'me':''}"><td>${i+1}.</td><td>${e[0]===PLAYER?'🚗':flagOf(e[0])} ${esc(dispName(e[0]))}</td><td class="r">${i===0?fmt(e[1]):fmtD(e[1]-ref)}</td></tr>`});
 return `<table>${rows}</table>`;
}
function showCareerStageEnd(){
 const cs=game.cs,i=game.stageIdx,re=game.rallyEnd;
 const rIdx=re?re.r:cs.r;const r=WORLD[rIdx];
 const st=re?null:cs.cur.stages[i];
 const stArr=Object.entries(st||{}).sort((a,b)=>a[1]-b[1]);
 if(!re){
  const pos=stArr.findIndex(e=>e[0]===PLAYER)+1;const ovr=Object.entries(cs.cur.overall).sort((a,b)=>a[1]-b[1]);const opos=ovr.findIndex(e=>e[0]===PLAYER)+1;
  show(`<div class="badge">${r.flag} ${r[lang]} · ${tr('PS','SS')}${i+1}</div><div class="big">${fmt(finishN)}</div><div class="rec">${pos===1?'★ '+tr('Miglior tempo!','Fastest time!')+' ★':tr('Posizione','Position')+' '+pos}</div>
   <h3>${tr('Risultato della prova','Stage result')}</h3>${resTable(stArr,stArr[0][1],5)}
   <h3>${tr('Classifica del rally','Rally standings')} · P${opos}</h3>${resTable(ovr,ovr[0][1],5)}
   <button class="btn pri" data-act="go">${tr('Continua','Continue')}</button>`,{go:careerHub});
 }else{
  const lastStage=Object.entries(game.lastStageTimes||{}).sort((a,b)=>a[1]-b[1]);
  const champ=cs.done;const stand=standings(cs.pts);const cpos=stand.findIndex(e=>e.n===PLAYER)+1;
  show(`<div class="badge">${r.flag} ${r[lang]} · ${tr('Arrivo','Final')}</div><h2>${re.pos===1?tr('Hai vinto il rally!','You won the rally!'):tr('Rally concluso','Rally finished')}</h2>
   <div class="rec">P${re.pos} · +${re.pos<=RALLY_PTS.length?RALLY_PTS[re.pos-1]:0} ${tr('punti','points')}</div>
   ${game.unlockF?`<p>🔓 ${tr('Nuova auto sbloccata: Fulmine Gr.B','New car unlocked: Fulmine Gr.B')}</p>`:''}
   <h3>${tr('Classifica finale del rally','Final rally standings')}</h3>${resTable(re.arr,re.arr[0][1],6)}
   <h3>${tr('Campionato piloti','Drivers\' championship')}</h3>${standTable(stand,5)}
   ${champ?`<h2>${cpos===1?'🏆 '+tr('Campione del mondo!','World champion!'):tr('Stagione conclusa','Season over')+' · P'+cpos}</h2>`:''}
   <button class="btn pri" data-act="go">${champ?tr('Menu','Menu'):tr('Prossimo rally','Next rally')}</button>`,{go:champ?home:careerHub});
 }
}

/* --- campionati --- */
function champList(){
 mode='menu';
 const hs=lsGet(HK);
 show(`<div class="badge">🏆 ${tr('Campionati','Championships')}</div><h2>${tr('Scegli un campionato','Choose a championship')}</h2>
  <p class="mute">${tr('Gare con 6 auto sulla stessa strada. Punti: 10-8-6-5-4-3.','Races with 6 cars on the same road. Points: 10-8-6-5-4-3.')}</p>
  <div class="modes">${CHAMPS.map(c=>{const b=lsGet('ps2_cbest_'+c.id);const stars='★'.repeat(Math.round((c.diff-.84)*25))||'★';
   const e=hs&&hs.id===c.id?`${tr('In corso','In progress')}: ${tr('gara','race')} ${hs.race+1}/${c.races.length}`:b?(b===1?'🏆 '+tr('Vinto','Won'):tr('Miglior risultato','Best result')+': P'+b):'';
   return `<button class="mode" data-act="pick" data-arg="${c.id}"><i>${c.flag}</i><div><b>${c[lang]}</b><span>${c.races.length} ${tr('gare','races')} · ${tr('difficoltà','difficulty')} ${stars}</span>${e?`<em>${e}</em>`:''}</div></button>`}).join('')}</div>
  <button class="btn sm" data-act="back">${tr('Indietro','Back')}</button>`,
 {back:home,pick:id=>{const h=lsGet(HK);if(h&&h.id===id)champHub();else if(h)confirmBox(tr('Hai un altro campionato in corso. Vuoi abbandonarlo?','Another championship is in progress. Abandon it?'),()=>newChamp(id),champList);else newChamp(id)}});
}
function newChamp(id){
 pickCar(c=>{const ci=CHAMPS.findIndex(x=>x.id===id);const ai=[];for(let k=0;k<5;k++){const d=DRIVERS[(ci*2+k*2)%DRIVERS.length];ai.push(d.n)}
  lsSet(HK,{id,car:c,race:0,pts:{},ai,res:[],seed:Math.floor(Math.random()*1e9)});champHub()},tr('Campionati','Championships'),champList);
}
function champStand(h){const names=[PLAYER,...h.ai];return names.map(n=>({n,p:h.pts[n]||0})).sort((a,b)=>b.p-a.p||(a.n===PLAYER?-1:1))}
function raceDef(h){const c=CHAMPS.find(x=>x.id===h.id),r=c.races[h.race];return{name:r[0],surface:r[1],weather:r[2],style:c.style,len:9000,startI:18,startLen:360,seed:h.seed+h.race*13+5}}
function champHub(){
 const h=lsGet(HK);if(!h){champList();return}
 const c=CHAMPS.find(x=>x.id===h.id);const rd=raceDef(h);
 previewStage(genStage(rd.seed,rd));mode='menu';
 const list=c.races.map((r,i)=>`<div class="${i===h.race?'cur':''}"><span>${i+1}. ${esc(r[0])}</span><span>${h.res[i]?'P'+h.res[i]:scen(r[1],r[2])}</span></div>`).join('');
 show(`<div class="badge">${c.flag} ${c[lang]}</div><h2>${tr('Gara','Race')} ${h.race+1}/${c.races.length}: ${esc(rd.name)}</h2><p class="mute">${scen(rd.surface,rd.weather)} · ${carById(h.car).name}</p>
  <div class="list">${list}</div><button class="btn pri" data-act="go">${tr('Vai in griglia','Go to the grid')}</button>
  <h3>${tr('Classifica','Standings')}</h3>${standTable(champStand(h),6)}
  <div class="row"><button class="btn sm" data-act="menu">Menu</button><button class="btn sm" data-act="quit">${tr('Abbandona','Abandon')}</button></div>`,
 {go:startRace,menu:home,quit:()=>confirmBox(tr('Abbandonare il campionato?','Abandon the championship?'),()=>{lsDel(HK);champList()},champHub)});
}
function startRace(){
 const h=lsGet(HK),c=CHAMPS.find(x=>x.id===h.id),rd=raceDef(h);
 setStage(genStage(rd.seed,rd));carSel=h.car;
 const st=champStand(h);const ppos=st.findIndex(e=>e.n===PLAYER);
 const slot=h.race===0?3:Math.max(0,Math.min(5,5-ppos));
 const ai=h.ai.map(n=>{const d=DRIVERS.find(x=>x.n===n);return{n,f:d.f,c:d.c,col:d.col,m:c.diff*(1-(d.b+(d.sp[rd.surface]||0)-1)*1.6)}});
 game={type:'race',ai,slot,h};best=null;begin();
}
function raceDone(){
 const order=veh.slice().sort((a,b)=>prog(b)-prog(a));
 const h=lsGet(HK),c=CHAMPS.find(x=>x.id===h.id);
 const names=order.map(v=>v.isPlayer?PLAYER:v.name);
 names.forEach((n,i)=>{h.pts[n]=(h.pts[n]||0)+(RACE_PTS[i]||0)});
 const pos=names.indexOf(PLAYER)+1;h.res[h.race]=pos;h.race++;
 game.raceRes={names,pos,raceIdx:h.race-1};
 if(h.race>=c.races.length){
  const st=champStand(h);const cp=st.findIndex(e=>e.n===PLAYER)+1;game.champEnd={st,cp};
  const pb=lsGet('ps2_cbest_'+c.id);if(!pb||cp<pb)lsSet('ps2_cbest_'+c.id,cp);
  if(cp===1&&unlock('saetta'))game.unlockS=true;
  lsDel(HK);game.h=h;
 }else{lsSet(HK,h);game.h=h}
}
function showRaceEnd(){
 const h=game.h,c=CHAMPS.find(x=>x.id===h.id),rr2=game.raceRes,ce=game.champEnd;
 const rows=rr2.names.map((n,i)=>`<tr class="${n===PLAYER?'me':''}"><td>${i+1}.</td><td>${n===PLAYER?'🚗':flagOf(n)} ${esc(dispName(n))}</td><td class="r">+${RACE_PTS[i]||0}</td></tr>`).join('');
 show(`<div class="badge">${c.flag} ${c[lang]} · ${tr('Gara','Race')} ${rr2.raceIdx+1}</div><h2>${rr2.pos===1?tr('Vittoria!','Victory!'):tr('Arrivo','Finish')+': P'+rr2.pos}</h2>
  <p class="mute">${tr('Tempo','Time')} ${fmt(finishN)} · ${tr('Urti','Hits')}: ${hits}</p><table>${rows}</table>
  ${ce?`<h2>${ce.cp===1?'🏆 '+tr('Campione!','Champion!'):tr('Campionato concluso','Championship over')+' · P'+ce.cp}</h2>${game.unlockS?`<p>🔓 ${tr('Nuova auto sbloccata: Saetta Classic','New car unlocked: Saetta Classic')}</p>`:''}`:''}
  <h3>${tr('Classifica','Standings')}</h3>${standTable(ce?ce.st:champStand(h),6)}
  <button class="btn pri" data-act="go">${ce?tr('Campionati','Championships'):tr('Prossima gara','Next race')}</button>`,{go:ce?champList:champHub});
}
function showResult(){$('#bPause').classList.add('hidden');if(game.type==='career')showCareerStageEnd();else if(game.type==='race')showRaceEnd();else showTimeTrialEnd()}

/* --- pausa --- */
function pause(){
 if(mode!=='run'&&mode!=='count')return;prevMode=mode;mode='pause';for(const k in keys)keys[k]=false;
 const back=game.type==='career'?careerHub:game.type==='race'?champHub:home;
 show(`<h2>${tr('Pausa','Paused')}</h2><button class="btn pri" data-act="res">${tr('Riprendi','Resume')}</button><button class="btn" data-act="rst">${tr('Ricomincia','Restart')}</button><button class="btn" data-act="out">${tr('Esci','Quit')}</button>`,
 {res:()=>{hideOv();mode=prevMode;$('#bPause').classList.remove('hidden')},rst:restart,out:()=>{mode='menu';back()}});
}
function restart(){
 if(!game)return;
 if(game.type==='race'){begin();return}
 if(game.type==='daily')best=lsGet('ps_best_'+dKey);
 begin();
}

/* ================= lingua, audio, input ================= */
function applyLang(){
 document.documentElement.lang=lang;
 $('#ttl').innerHTML=`${tr('Prova','Special')} <span>${tr('Speciale','Stage')}</span>`;
 $('#bLang').textContent=lang==='it'?'EN':'IT';
 $('#allLink').textContent=tr('Tutti i giochi di Universo Sportivo','All Universo Sportivo games');$('#lBrk').textContent=tr('FRENO','BRAKE');$('#lGas').textContent='GAS';
 document.title=tr('Prova Speciale – Gioco di Rally | Universo Sportivo','Special Stage – Rally Game | Universo Sportivo');
}
$('#bLang').onclick=()=>{lang=lang==='it'?'en':'it';applyLang();if(mode==='menu'&&!ov.classList.contains('hidden'))home();else if(endShown)showResult()};
function applySound(){$('#bSound').textContent=sound?'🔊':'🔇'}
$('#bSound').onclick=()=>{sound=!sound;try{localStorage.setItem('ps_sound',sound?'1':'0')}catch(e){}applySound();
 if(sound)audioInit();else if(window.speechSynthesis){try{speechSynthesis.cancel()}catch(e){}}if(AC&&AC.state==='suspended')AC.resume()};
$('#bPause').onclick=pause;
const KM={ArrowLeft:'l',KeyA:'l',ArrowRight:'r',KeyD:'r',ArrowUp:'g',KeyW:'g',ArrowDown:'b',KeyS:'b',Space:'b'};
addEventListener('keydown',e=>{
 if(KM[e.code]){if(mode==='run'||mode==='count'||mode==='end')e.preventDefault();keys[KM[e.code]]=true}
 if(e.code==='KeyR'&&(mode==='run'||mode==='count')){e.preventDefault();restart()}
 if((e.code==='KeyP'||e.code==='Escape')&&(mode==='run'||mode==='count'))pause();
});
addEventListener('keyup',e=>{if(KM[e.code])keys[KM[e.code]]=false});
addEventListener('blur',()=>{for(const k in keys)keys[k]=false;if(mode==='run')pause()});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&mode==='run')pause()});
for(const[id,k]of[['left','l'],['right','r'],['gas','g'],['brk','b']]){
 const el=document.getElementById(id);
 const on=e=>{e.preventDefault();keys[k]=true;el.classList.add('on');try{el.setPointerCapture(e.pointerId)}catch(x){}};
 const off=()=>{keys[k]=false;el.classList.remove('on')};
 el.addEventListener('pointerdown',on);el.addEventListener('pointerup',off);el.addEventListener('pointercancel',off);el.addEventListener('lostpointercapture',off);
 el.addEventListener('contextmenu',e=>e.preventDefault());
}
function sendH(){try{parent.postMessage({type:'setHeight',height:document.documentElement.scrollHeight},'*')}catch(e){}}
function resize(){W=wrap.clientWidth;H=Math.round(W*1.3);dpr=Math.min(2,window.devicePixelRatio||1);cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);cv.style.height=H+'px';
 ov.querySelectorAll('canvas[data-car]').forEach(c=>drawPreview(c,carById(c.dataset.car)));sendH()}
addEventListener('resize',resize);

applyLang();applySound();resize();home();requestAnimationFrame(frame);
setTimeout(sendH,300);
})();
</script>
